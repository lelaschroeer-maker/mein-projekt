<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --neon-green: #39ff14;
    --neon-pink: #ff1493;
    --neon-cyan: #00ffff;
    --neon-yellow: #ffff00;
    --neon-purple: #b026ff;
    --bg: #0d0221;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: radial-gradient(circle at 50% 30%, #1a0533, var(--bg));
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    padding: 20px;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--neon-pink), var(--neon-yellow));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.6));
  }

  #score {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--neon-yellow);
    text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-pink);
    letter-spacing: 2px;
  }

  .board-wrap {
    position: relative;
  }

  canvas {
    background: #05010f;
    border: 3px solid var(--neon-purple);
    border-radius: 8px;
    box-shadow: 0 0 20px var(--neon-purple), 0 0 40px rgba(176, 38, 255, 0.4), inset 0 0 30px rgba(176, 38, 255, 0.15);
    display: block;
    touch-action: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(5, 1, 15, 0.85);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }

  #overlay.hidden { display: none; }

  #overlay h2 {
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--neon-pink);
    text-shadow: 0 0 12px var(--neon-pink), 0 0 24px var(--neon-purple);
  }

  #overlay p { font-size: 1.1rem; color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }

  button {
    margin-top: 8px;
    padding: 14px 32px;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--bg);
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 15px var(--neon-green), 0 0 30px rgba(57, 255, 20, 0.5);
    transition: transform 0.1s, box-shadow 0.2s;
  }

  button:hover { transform: scale(1.06); box-shadow: 0 0 25px var(--neon-cyan), 0 0 50px var(--neon-cyan); }
  button:active { transform: scale(0.97); }

  .hint { font-size: 0.9rem; color: #9a7fd1; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div id="score">Diamanten: 0</div>
  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">Bereit?</h2>
      <p id="overlayText">Führe das goldene Polo-Pony, sammle Diamanten und weiche Wänden &amp; dir selbst aus!</p>
      <button id="startBtn">Start</button>
    </div>
  </div>
  <p class="hint">Steuerung: Pfeiltasten &nbsp;·&nbsp; Pause: Leertaste</p>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;              // Zellen pro Reihe/Spalte
  const CELL = canvas.width / GRID;
  const SPEED = 110;            // ms pro Schritt

  // Goldtöne für die Schlange
  const COLORS = ['#fff3b0', '#ffd700', '#f4c430', '#e6b800', '#d4af37'];

  let snake, dir, nextDir, food, score, loop, running, paused;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    paused = false;
    placeFood();
    updateScore();
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateScore() {
    scoreEl.textContent = 'Diamanten: ' + score;
  }

  function step() {
    if (paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Kollision mit Wand oder Körper
    if (
      head.x < 0 || head.x >= GRID ||
      head.y < 0 || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      updateScore();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Nahrung: funkelnder Diamant
    const t = (Date.now() % 600) / 600;
    drawDiamond(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2.2, t);

    // Schlange (Regenbogen-Segmente)
    snake.forEach((seg, i) => {
      const color = COLORS[i % COLORS.length];
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = i === 0 ? 20 : 10;
      ctx.fillStyle = color;
      roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 5);
      ctx.fill();
      ctx.restore();

      // Polo-Ralph-Lauren-Pony auf dem Kopf
      if (i === 0) {
        drawPolo(seg.x * CELL + CELL / 2, seg.y * CELL + CELL / 2, CELL * 0.85);
      }
    });
  }

  // Funkelnder Diamant
  function drawDiamond(cx, cy, r, t) {
    const pulse = 1 + Math.sin(t * Math.PI * 2) * 0.06;
    r *= pulse;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 18 + Math.sin(t * Math.PI * 2) * 8;

    const top = -r, bottom = r, half = r * 0.75, girdle = -r * 0.35;
    // Körper mit Verlauf
    const grad = ctx.createLinearGradient(0, top, 0, bottom);
    grad.addColorStop(0, '#e0ffff');
    grad.addColorStop(0.5, '#00e5ff');
    grad.addColorStop(1, '#0077b6');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, top);
    ctx.lineTo(half, girdle);
    ctx.lineTo(0, bottom);
    ctx.lineTo(-half, girdle);
    ctx.closePath();
    ctx.fill();

    // Facetten-Linien
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-half, girdle); ctx.lineTo(half, girdle);
    ctx.moveTo(0, top); ctx.lineTo(0, bottom);
    ctx.moveTo(0, top); ctx.lineTo(-half * 0.45, girdle);
    ctx.moveTo(0, top); ctx.lineTo(half * 0.45, girdle);
    ctx.moveTo(-half, girdle); ctx.lineTo(0, bottom);
    ctx.moveTo(half, girdle); ctx.lineTo(0, bottom);
    ctx.stroke();

    // Glanzpunkt
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.35, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Stilisierter Polo-Reiter (Ralph-Lauren-Silhouette)
  function drawPolo(cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s / 100, s / 100);
    ctx.translate(-50, -50);
    ctx.fillStyle = '#05010f';
    ctx.strokeStyle = '#05010f';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Pferdekörper
    ctx.beginPath();
    ctx.moveTo(24, 66);
    ctx.quadraticCurveTo(20, 54, 34, 52);
    ctx.quadraticCurveTo(50, 50, 66, 52);
    ctx.quadraticCurveTo(80, 53, 80, 62);
    ctx.lineTo(78, 64);
    ctx.quadraticCurveTo(70, 60, 60, 61);
    ctx.quadraticCurveTo(44, 62, 34, 63);
    ctx.quadraticCurveTo(28, 64, 26, 68);
    ctx.closePath();
    ctx.fill();

    // Hals & Kopf des Pferds
    ctx.beginPath();
    ctx.moveTo(76, 54);
    ctx.quadraticCurveTo(84, 46, 88, 36);
    ctx.lineTo(92, 34);
    ctx.quadraticCurveTo(90, 46, 84, 55);
    ctx.closePath();
    ctx.fill();

    // Beine (galoppierend)
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(32, 63); ctx.lineTo(26, 78);
    ctx.moveTo(40, 63); ctx.lineTo(44, 80);
    ctx.moveTo(62, 62); ctx.lineTo(58, 80);
    ctx.moveTo(70, 61); ctx.lineTo(76, 77);
    ctx.stroke();

    // Schweif
    ctx.beginPath();
    ctx.moveTo(24, 56);
    ctx.quadraticCurveTo(14, 56, 12, 70);
    ctx.lineTo(16, 70);
    ctx.quadraticCurveTo(20, 60, 26, 60);
    ctx.closePath();
    ctx.fill();

    // Reiter
    ctx.beginPath();
    ctx.arc(50, 34, 6, 0, Math.PI * 2); // Kopf
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(50, 40); ctx.lineTo(48, 54); // Körper
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(49, 44); ctx.lineTo(64, 30); // erhobener Arm mit Schläger
    ctx.stroke();

    // Poloschläger
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(64, 30); ctx.lineTo(72, 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(70, 18); ctx.lineTo(76, 20);
    ctx.stroke();

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function gameOver() {
    clearInterval(loop);
    running = false;
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = 'Deine Punktzahl: ' + score;
    startBtn.textContent = 'Nochmal';
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    running = true;
    clearInterval(loop);
    loop = setInterval(step, SPEED);
    draw();
  }

  // Steuerung
  document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (key === ' ' && running) {
      paused = !paused;
      e.preventDefault();
      return;
    }
    if (!running) return;

    const map = {
      ArrowUp: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }
    };
    const nd = map[key];
    if (!nd) return;
    e.preventDefault();
    // Keine 180°-Wende
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  });

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
